[project]
name = "finflow_v2"
version = "0.1.0"
description = "Personal finance automation system"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "boto3>=1.43.75",
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.19.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[dynamodb,events,secretsmanager,sqs,ssm]>=1.43.75",
    "httpx2>=2.12.0",
    "moto[dynamodb,events,secretsmanager,server,sqs]>=5.2.2",
    "poethepoet>=0.48.0",
    "pre-commit",
    "pyright",
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]
fix = true
unsafe-fixes = false

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "A",
    "N",
    "PERF",
    "RUF",
    "ANN",
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["finflow_v2"]
combine-as-imports = true
force-sort-within-sections = true
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 88

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = [
    "**/__pycache__",
    ".venv",
    ".ruff_cache",
    ".pytest_cache",
    "**/node_modules",
    "**/.*",
    "**/.git",
]
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingImports = "error"
reportMissingTypeStubs = "warning"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "-q"]

[tool.poe.tasks]
format = "ruff format ."
lint = "ruff check ."
lint-fix = "ruff check --fix ."
typecheck = "pyright"
test = "pytest"

[tool.poe.tasks.check]
sequence = ["format-check", "lint", "typecheck", "test"]

[tool.poe.tasks.format-check]
cmd = "ruff format --check ."

[tool.poe.tasks.fix]
sequence = ["format", "lint-fix"]
