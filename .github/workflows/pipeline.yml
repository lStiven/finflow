# Every push to master deploys production and every push to dev deploys
# development — but only once everything that proves the old still works has
# passed. See docs/ci.md for the one-time setup this needs in AWS and GitHub.
#
#   checks  ── formato, lint, tipos, pruebas unitarias y de integración,
#              contrato de la API, frontend, plantilla desplegable
#   e2e     ── solo en master: la pila local entera en el runner, flujo de
#              dos usuarios y todas las e2e en un navegador, pantallas incluidas
#   deploy  ── backend y web juntos, smoke contra lo desplegado; si algo falla,
#              vuelve a la última versión que pasó
#
# Nothing reaches AWS until the first two are green, and no job of one
# environment runs beside another job of the same environment.

name: Validar y desplegar

on:
  push:
    branches: [master, dev]
    # A push that only touches prose runs nothing: no check reads it and
    # nothing deploys it. Everything else runs, including files nobody listed
    # here yet — the filter names what to skip, not what to run, so a new kind
    # of file costs a run rather than an unchecked deploy. `docs/openapi.json`
    # is the one file under docs/ that is code: `openapi-check` compares it
    # against the routers. Later lines win, which is what lets it back in.
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "docs/openapi.json"
  # A run asked for by hand always runs, whatever changed.
  workflow_dispatch:

# One pipeline per branch at a time, never cancelled halfway: a deploy stopped
# between the backend and the web leaves the two out of step.
concurrency:
  group: pipeline-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Validaciones (check-all)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: extractions/setup-just@v3

      - name: Dependencias
        run: |
          uv sync --frozen
          npm ci --prefix frontend

      # The local settings, which point at the in-process emulator: nothing
      # here talks to AWS. The script also makes the run's own token secret,
      # which `.env.example` leaves empty on purpose.
      - name: Configuración local
        run: scripts/ci/local-env.sh

      - name: Formato, lint, tipos, pruebas, contrato y frontend
        run: just check-all

      - name: Plantilla desplegable en los dos entornos
        run: just infra-check

  # Production only. On dev the browser suites cost more than they catch —
  # dev is where things are tried — so a push there goes from the checks
  # straight to deploying development. Anything bound for production still
  # passes through here first, since a push to master runs it.
  e2e:
    name: Flujos y pantallas en el navegador
    needs: checks
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: extractions/setup-just@v3

      - name: Dependencias y navegador
        run: |
          uv sync --frozen
          npm ci --prefix frontend
          npx --prefix frontend playwright install --with-deps chromium

      - name: Levantar la pila local
        run: scripts/ci/local-stack.sh start

      - name: Dos usuarios de punta a punta, sin cruzarse
        run: just verify

      - name: Todas las e2e, pantallas incluidas
        run: just e2e

      - name: Bajar la pila
        if: always()
        run: scripts/ci/local-stack.sh stop

      - name: Guardar los logs si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-e2e
          path: .ci-logs/
          retention-days: 7

  deploy:
    name: Desplegar y comprobar
    needs: [checks, e2e]
    # A skipped e2e (every dev push) must not skip this too, which is what a
    # plain `needs` does. A failed or cancelled one still stops it.
    if: >-
      !cancelled() && needs.checks.result == 'success' &&
      (needs.e2e.result == 'success' ||
       (needs.e2e.result == 'skipped' && github.ref_name != 'master'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # The GitHub environment holds this target's role, secrets and Cloudflare
    # account, and is what keeps a dev push from ever holding production's.
    environment: ${{ github.ref_name == 'master' && 'production' || 'development' }}
    permissions:
      contents: write # to move the `deployed/<entorno>` tag
      id-token: write # to assume the AWS role by OIDC, with no stored keys
    env:
      TARGET: ${{ github.ref_name == 'master' && 'production' || 'development' }}
      AWS_PROFILE_NAME: ${{ github.ref_name == 'master' && 'finflow-production' || 'finflow-dev' }}
      ENV_FILE_NAME: ${{ github.ref_name == 'master' && '.env.production' || '.env.development' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags say what is deployed now

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: extractions/setup-just@v3

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Dependencias
        run: |
          uv sync --frozen
          npm ci --prefix frontend

      # What GitHub will present to AWS, so a refused role can be compared
      # against its trust policy field by field. Claims only: the token
      # itself is a credential and is never printed.
      - name: Qué dice el token de GitHub
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");
            const claims = JSON.parse(
              Buffer.from(token.split(".")[1], "base64url").toString(),
            );
            for (const key of ["aud", "sub", "ref", "environment", "repository"]) {
              core.info(`${key}: ${claims[key]}`);
            }
            core.info(`rol pedido: ${process.env.ROLE || "(AWS_ROLE_ARN vacío)"}`);
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 3600

      - name: Perfil de AWS y configuración del entorno
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          scripts/ci/aws-profile.sh "$AWS_PROFILE_NAME"
          printf '%s\n' "$ENV_FILE_CONTENT" > "$ENV_FILE_NAME"

      - name: Qué está desplegado ahora
        id: previous
        run: |
          sha="$(git rev-parse -q --verify "refs/tags/deployed/$TARGET^{commit}" || true)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "desplegado ahora en $TARGET: ${sha:-nada registrado todavía}"

      - name: Desplegar backend y web
        id: deploy
        run: scripts/ci/deploy.sh "$TARGET"

      - name: Smoke contra lo desplegado
        id: smoke
        run: scripts/ci/smoke.sh "$TARGET"

      - name: Marcar esta versión como la desplegada
        run: |
          git tag -f "deployed/$TARGET" "$GITHUB_SHA"
          git push -f origin "refs/tags/deployed/$TARGET"

      # Only when this run changed what is deployed and it did not hold: the
      # previous release goes out again, through the same script, and the run
      # still ends red so the failure is seen.
      - name: Volver a la versión anterior
        if: >-
          failure() && steps.previous.outputs.sha != '' &&
          (steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure')
        env:
          PREVIOUS: ${{ steps.previous.outputs.sha }}
        run: |
          echo "volviendo a $PREVIOUS"
          git worktree add ../previous "$PREVIOUS"
          cp "$ENV_FILE_NAME" "../previous/$ENV_FILE_NAME"
          npm ci --prefix ../previous/frontend
          scripts/ci/deploy.sh "$TARGET" ../previous
          scripts/ci/smoke.sh "$TARGET"
          echo "::error::El despliegue de $GITHUB_SHA falló; $TARGET volvió a $PREVIOUS."
