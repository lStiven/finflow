		.d2-696654111 .stroke-B2{stroke:#CBA6f7;}.appendix text.text{fill:#E2E8F0}.md{--color-fg-default:#E2E8F0;--color-fg-muted:#CBD5E1;--color-fg-subtle:#A6ADC8;--color-canvas-default:#0B0A1A;--color-canvas-subtle:#313244;--color-border-default:#CBA6f7;--color-border-muted:#CBA6f7;--color-neutral-muted:#313244;--color-accent-fg:#CBA6f7;--color-accent-emphasis:#CBA6f7;--color-attention-subtle:#CBD5E1;--color-danger-fg:red;}.light-code{display: none}.dark-code{display: block}]]></style><g class="aGVhZGluZw== heading"><g class="shape" ></g><text x="492" y="-16" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:30px">Alerts: qué avisa y por dónde</text></g><g class="bGVnZW5k note"><g class="shape" ></g><text x="492.5" y="429" fill="#94A3B8" class="text" style="text-anchor:middle;font-size:18px"><tspan x="492.5" dy="0">cian: si el canal tiene ese tipo encendido (y, en un movimiento, sobre su monto mínimo) · ámbar: siempre, aunque haya apagado los avisos</tspan><tspan x="492.5" dy="20.5">Se pregunta antes de mandar y se anota después: el mismo evento dos veces no avisa dos veces</tspan></text></g><g class="bW92ZWQ= card"><g class="shape" ><rect x="12" y="12" width="380" height="86" rx="12" stroke="#10B981" fill="#14112B" style="stroke-width:2;" /></g><text x="202" y="52" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:20px"><tspan x="202" dy="0">Se movió plata</tspan><tspan x="202" dy="23">MovementRecorded, de Financial</tspan></text></g><g class="bW9uZGF5 card"><g class="shape" ><rect x="12" y="135" width="380" height="86" rx="12" stroke="#60A5FA" fill="#14112B" style="stroke-width:2;" /></g><text x="202" y="175" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:20px"><tspan x="202" dy="0">Lunes 08:00 de Bogotá</tspan><tspan x="202" dy="23">resumen de la semana anterior</tspan></text></g><g class="cGF1c2Vk card"><g class="shape" ><rect x="12" y="260" width="380" height="120" rx="12" stroke="#D946EF" fill="#14112B" style="stroke-width:2;" /></g><text x="202" y="317" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:20px"><tspan x="202" dy="0">El modelo dejó de leer</tspan><tspan x="202" dy="23">ModelReadingSuspended, de Ingestion</tspan></text></g><g class="YmVsbA== good"><g class="shape" ><rect x="672" y="19" width="300" height="120" rx="12" stroke="#10B981" fill="#052E1B" style="stroke-width:2;" /></g><text x="822" y="76.5" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:19px"><tspan x="822" dy="0">La campana de la app</tspan><tspan x="822" dy="21.5">30 días, con o sin Telegram</tspan></text></g><g class="dGVsZWdyYW0= good"><g class="shape" ><rect x="672" y="159" width="300" height="120" rx="12" stroke="#10B981" fill="#052E1B" style="stroke-width:2;" /></g><text x="822" y="216.5" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:19px"><tspan x="822" dy="0">Telegram</tspan><tspan x="822" dy="21.5">cada canal vinculado</tspan></text></g><g class="bWFpbA== hold"><g class="shape" ><rect x="672" y="308" width="300" height="83" rx="12" stroke="#F59E0B" fill="#2A1A05" style="stroke-width:2;" /></g><text x="822" y="347" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:19px"><tspan x="822" dy="0">Correo</tspan><tspan x="822" dy="21.5">a la dirección de Identity</tspan></text></g><g class="KG1vdmVkIC0mZ3Q7IGJlbGwpWzBd event"><marker id="mk-d2-696654111-4093171048" markerWidth="13" markerHeight="16" refX="8.5" refY="8" viewBox="0 0 13 16" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 13,8 0,16" fill="#22D3EE" class="connection" stroke-width="3" /> </marker><path d="M 394.5 40.666 L 666.5 40.666" stroke="#22D3EE" fill="none" class="connection animated-connection" style="stroke-width:3;stroke-dasharray:15.000000,14.583620;stroke-dashoffset:-295.836200;animation: dashdraw 7.291810s linear infinite;" marker-end="url(#mk-d2-696654111-4093171048)" mask="url(#d2-696654111)" /></g><g class="KG1vdmV