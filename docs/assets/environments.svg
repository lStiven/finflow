x="700" y="76.5" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:23px"><tspan x="700" dy="0">development</tspan><tspan x="700" dy="23.666667"> </tspan><tspan x="700" dy="23.666667">.env.development</tspan><tspan x="700" dy="23.666667">AWS real, todo con prefijo dev-</tspan><tspan x="700" dy="23.666667">su propio buzón de Gmail</tspan><tspan x="700" dy="23.666667"> </tspan><tspan x="700" dy="23.666667">just up-dev · just deploy-dev</tspan><tspan x="700" dy="23.666667">entra por IMAP, cada 5 minutos</tspan><tspan x="700" dy="23.666667">lo despliega un push a dev</tspan></text></g><g class="cHJvZA== card"><g class="shape" ><rect x="960" y="0" width="440" height="320" rx="12" stroke="#F43F5E" fill="#14112B" style="stroke-width:3;" /></g><text x="1180" y="76.5" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:23px"><tspan x="1180" dy="0">production</tspan><tspan x="1180" dy="23.666667"> </tspan><tspan x="1180" dy="23.666667">.env.production</tspan><tspan x="1180" dy="23.666667">AWS real, nombres desnudos</tspan><tspan x="1180" dy="23.666667">su propio buzón de Gmail</tspan><tspan x="1180" dy="23.666667"> </tspan><tspan x="1180" dy="23.666667">just run-prod · just deploy-prod</tspan><tspan x="1180" dy="23.666667">entra por IMAP, cada minuto</tspan><tspan x="1180" dy="23.666667">lo despliega un merge a master</tspan></text></g><mask id="d2-4265890981" maskUnits="userSpaceOnUse" x="-34" y="-91" width="1468" height="505">
