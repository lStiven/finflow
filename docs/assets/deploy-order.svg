		.d2-4099796117 .stroke-B2{stroke:#CBA6f7;}.appendix text.text{fill:#E2E8F0}.md{--color-fg-default:#E2E8F0;--color-fg-muted:#CBD5E1;--color-fg-subtle:#A6ADC8;--color-canvas-default:#0B0A1A;--color-canvas-subtle:#313244;--color-border-default:#CBA6f7;--color-border-muted:#CBA6f7;--color-neutral-muted:#313244;--color-accent-fg:#CBA6f7;--color-accent-emphasis:#CBA6f7;--color-attention-subtle:#CBD5E1;--color-danger-fg:red;}.light-code{display: none}.dark-code{display: block}]]></style><g class="aGVhZGluZw== heading"><g class="shape" ></g><text x="604" y="-28" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:30px">Un despliegue: tres piezas, en este orden</text></g><g class="bGVnZW5k note"><g class="shape" ></g><text x="603.5" y="384" fill="#94A3B8" class="text" style="text-anchor:middle;font-size:18px"><tspan x="603.5" dy="0">Las funciones se enganchan a colas que ya existen, y el bundle se construye contra una API que ya responde.</tspan><tspan x="603.5" dy="20.5">Sin el paso de CORS la app carga entera y ninguna llamada pasa el preflight.</tspan></text></g><g class="cHJvdmlzaW9u card"><g class="shape" ><rect x="0" y="0" width="360" height="170" rx="12" stroke="#A78BFA" fill="#14112B" style="stroke-width:3;" /></g><text x="180" y="52" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:20px"><tspan x="180" dy="0">1 · Aprovisionar</tspan><tspan x="180" dy="21.2">just provision-dev / -prod</tspan><tspan x="180" dy="21.2"> </tspan><tspan x="180" dy="21.2">tablas, colas, DLQ, bus y reglas</tspan><tspan x="180" dy="21.2">crea o ajusta, nunca borra</tspan></text></g><g class="ZGVwbG95 card"><g class="shape" ><rect x="424" y="0" width="360" height="170" rx="12" stroke="#FF9900" fill="#14112B" style="stroke-width:3;" /></g><text x="604" y="52" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:20px"><tspan x="604" dy="0">2 · Desplegar</tspan><tspan x="604" dy="21.2">just deploy-dev / -prod</tspan><tspan x="604" dy="21.2"> </tspan><tspan x="604" dy="21.2">las siete Lambda con SAM,</tspan><tspan x="604" dy="21.2">sus disparadores y la URL de la API</tspan></text></g><g class="cHVibGlzaA== card"><g class="shape" ><rect x="848" y="0" width="360" height="170" rx="12" stroke="#F38020" fill="#14112B" style="stroke-width:3;" /></g><text x="1028" y="52" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:20px"><tspan x="1028" dy="0">3 · Publicar</tspan><tspan x="1028" dy="21.2">just web-publish-dev / web-publish</tspan><tspan x="1028" dy="21.2"> </tspan><tspan x="1028" dy="21.2">lee la ApiUrl, construye</tspan><tspan x="1028" dy="21.2">y sube a Cloudflare Pages</tspan></text></g><g class="Z2FwMQ==" style='opacity:0'><g class="shape" ><rect x="0" y="226" width="360" height="120" stroke="#CBA6f7" fill="#313244" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g></g><g class="Z2FwMg==" style='opacity:0'><g class="shape" ><rect x="424" y="226" width="360" height="120" stroke="#CBA6f7" fill="#313244" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g></g><g class="Y29ycw== hold"><g class="shape" ><rect x="848" y="226" width="360" height="120" rx="12" stroke="#F59E0B" fill="#2A1A05" style="stroke-width:2;" /></g><text x="1028" y="274" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:19px"><tspan x="1028" dy="0">Solo la primera vez:</tspan><tspan x="1028" dy="20.666667">el origen publicado va a CorsOrigins</tspan><tspan x="1028" dy="20.666667">y se vuelve a desplegar el backend</tspan></text></g><g class="KHByb3Zpc2lvbiAtJmd0OyBkZXBsb3kpWzBd event"><marker id="mk-d2-4099796117-4093171048" markerWidth="13" markerHeight="16" refX="8.5" refY="8" viewBox="0 0 13 16" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 13,8 0,16" fill="#22D3EE" class="connection" stroke-width="3" /> </marker><path d="M 363 85 L 418 85" stroke="#22D3EE" fill="none" class="connection animated-connection" style="stroke-width:3;stroke-dasharray:15.000000,14.583620;stroke-dashoffset:-295.836200;animation: dashdraw 7.291810s linear infinite;" marker-end="url(#mk-d2-4099796117-4093171048)" mask="url(#d2-4099796117)" /></g><g class="KGRlcGxveSAtJmd0OyBwdWJsaXNoKVswXQ== event"><path d="M 787 85 L 842 85" stroke="#22D3EE" fill="none" class="connection animated-connection" style="stroke-width:3;stroke-dasharray:15.000000,14.583620;stroke-dashoffset:-295.836200;animation: dashdraw 7.291810s linear infinite;" marker-end="url(#mk-d2-4099796117-4093171048)" mask="url(#d2-4099796117)" /></g><g class="KHB1Ymxpc2ggLSZndDsgY29ycylbMF0= quiet"><marker id="mk-d2-4099796117-3567666233" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#64748B" class="connection" stroke-width="2" /> </marker><path d="M 1028 172.5 L 1028 222" stroke="#64748B" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:8.000000,7.892511;" marker-end="url(#mk-d2-4099796117-3567666233)" mask="url(#d2-4099796117)" /></g><g class="KGNvcnMgLSZndDsgZGVwbG95KVswXQ== quiet"><path d="M 899.193148 225.142511 L 787.065416 171.92935" stroke="#64748B" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:8.000000,7.892511;" marker-end="url(#mk-d2-4099796117-3567666233)" mask="url(#d2-4099796117)" /></g><mask id="d2-4099796117" maskUnits="userSpaceOnUse" x="-34" y="-91" width="1276" height="531">
