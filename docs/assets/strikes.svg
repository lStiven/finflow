		.d2-1555918808 .stroke-B2{stroke:#CBA6f7;}.appendix text.text{fill:#E2E8F0}.md{--color-fg-default:#E2E8F0;--color-fg-muted:#CBD5E1;--color-fg-subtle:#A6ADC8;--color-canvas-default:#0B0A1A;--color-canvas-subtle:#313244;--color-border-default:#CBA6f7;--color-border-muted:#CBA6f7;--color-neutral-muted:#313244;--color-accent-fg:#CBA6f7;--color-accent-emphasis:#CBA6f7;--color-attention-subtle:#CBD5E1;--color-danger-fg:red;}.light-code{display: none}.dark-code{display: block}]]></style><g class="aGVhZGluZw== heading"><g class="shape" ></g><text x="585.5" y="-28" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:30px">Los strikes del modelo</text></g><g class="bGVnZW5k note"><g class="shape" ></g><text x="585.5" y="198" fill="#94A3B8" class="text" style="text-anchor:middle;font-size:18px">Cada ráfaga nueva sube un escalón · un strike caduca a los 90 días · solo se suspende el modelo: las plantillas siguen leyendo · reactivar borra los strikes</text></g><g class="YnVyc3Q= card"><g class="shape" ><rect x="0" y="0" width="270" height="160" rx="12" stroke="#A78BFA" fill="#14112B" style="stroke-width:2;" /></g><text x="135" y="57" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:20px"><tspan x="135" dy="0">10 correos que no son</tspan><tspan x="135" dy="21.5">de un banco</tspan><tspan x="135" dy="21.5">en menos de una hora</tspan><tspan x="135" dy="21.5">(según el modelo)</tspan></text></g><g class="b25l hold"><g class="shape" ><rect x="334" y="0" width="230" height="160" rx="12" stroke="#F59E0B" fill="#2A1A05" style="stroke-width:2;" /></g><text x="449" y="49" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:19px"><tspan x="449" dy="0">Strike 1</tspan><tspan x="449" dy="20"> </tspan><tspan x="449" dy="20">el modelo no lee</tspan><tspan x="449" dy="20">sus correos</tspan><tspan x="449" dy="20">un día</tspan></text></g><g class="dHdv hold"><g class="shape" ><rect x="628" y="0" width="230" height="160" rx="12" stroke="#FB923C" fill="#2A1A05" style="stroke-width:2;" /></g><text x="743" y="49" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:19px"><tspan x="743" dy="0">Strike 2</tspan><tspan x="743" dy="20"> </tspan><tspan x="743" dy="20">tres días,</tspan><tspan x="743" dy="20">y el aviso dice</tspan><tspan x="743" dy="20">que es el último</tspan></text></g><g class="dGhyZWU= drop"><g class="shape" ><rect x="922" y="0" width="250" height="160" rx="12" stroke="#F43F5E" fill="#3B0A12" style="stroke-width:2;" /></g><text x="1047" y="49" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:19px"><tspan x="1047" dy="0">Strike 3</tspan><tspan x="1047" dy="20"> </tspan><tspan x="1047" dy="20">para siempre,</tspan><tspan x="1047" dy="20">hasta que un operador</tspan><tspan x="1047" dy="20">lo reactive</tspan></text></g><g class="KGJ1cnN0IC0mZ3Q7IG9uZSlbMF0= no"><marker id="mk-d2-1555918808-2328043311" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#F43F5E" class="connection" stroke-width="2" /> </marker><path d="M 272 80 L 330 80" stroke="#F43F5E" fill="none" class="connection" style="stroke-width:2;" marker-end="url(#mk-d2-1555918808-2328043311)" mask="url(#d2-1555918808)" /></g><g class="KG9uZSAtJmd0OyB0d28pWzBd no"><path d="M 566 80 L 624 80" stroke="#F43F5E" fill="none" class="connection" style="stroke-width:2;" marker-end="url(#mk-d2-1555918808-2328043311)" mask="url(#d2-1555918808)" /></g><g class="KHR3byAtJmd0OyB0aHJlZSlbMF0= no"><path d="M 860 80 L 918 80" stroke="#F43F5E" fill="none" class="connection" style="stroke-width:2;" marker-end="url(#mk-d2-1555918808-2328043311)" mask="url(#d2-1555918808)" /></g><mask id="d2-1555918808" maskUnits="userSpaceOnUse" x="-33" y="-91" width="1238" height="327">
