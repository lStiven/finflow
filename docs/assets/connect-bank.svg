		.d2-2582910892 .stroke-B2{stroke:#CBA6f7;}.appendix text.text{fill:#E2E8F0}.md{--color-fg-default:#E2E8F0;--color-fg-muted:#CBD5E1;--color-fg-subtle:#A6ADC8;--color-canvas-default:#0B0A1A;--color-canvas-subtle:#313244;--color-border-default:#CBA6f7;--color-border-muted:#CBA6f7;--color-neutral-muted:#313244;--color-accent-fg:#CBA6f7;--color-accent-emphasis:#CBA6f7;--color-attention-subtle:#CBD5E1;--color-danger-fg:red;}.light-code{display: none}.dark-code{display: block}]]></style><g class="aGVhZGluZw== heading"><g class="shape" ></g><text x="732" y="-28" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:30px">Conectar un banco: cuatro pasos</text></g><g class="bGVnZW5k note"><g class="shape" ></g><text x="732" y="248" fill="#94A3B8" class="text" style="text-anchor:middle;font-size:18px">violeta: lo hace la app · ámbar: lo haces tú · cian: lo hace el worker solo · abajo, la clave del paso en GET /ingestion/setup</text></g><g class="czE= card"><g class="shape" ><rect x="0" y="0" width="330" height="210" rx="12" stroke="#A78BFA" fill="#14112B" style="stroke-width:3;" /></g><text x="165" y="62" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:20px"><tspan x="165" dy="0">1 · Te registras</tspan><tspan x="165" dy="21"> </tspan><tspan x="165" dy="21">la dirección se asigna sola:</tspan><tspan x="165" dy="21">finflowingest+&lt;id&gt;@gmail.com</tspan><tspan x="165" dy="21"> </tspan><tspan x="165" dy="21">address_assigned</tspan></text></g><g class="czI= card"><g class="shape" ><rect x="378" y="0" width="330" height="210" rx="12" stroke="#F59E0B" fill="#14112B" style="stroke-width:3;" /></g><text x="543" y="62" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:20px"><tspan x="543" dy="0">2 · Apruebas remitentes</tspan><tspan x="543" dy="21"> </tspan><tspan x="543" dy="21">el dominio de tu banco;</tspan><tspan x="543" dy="21">sin ninguno, no entra nada</tspan><tspan x="543" dy="21"> </tspan><tspan x="543" dy="21">senders_approved</tspan></text></g><g class="czM= card"><g class="shape" ><rect x="756" y="0" width="330" height="210" rx="12" stroke="#22D3EE" fill="#14112B" style="stroke-width:3;" /></g><text x="921" y="62" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:20px"><tspan x="921" dy="0">3 · Gmail confirma el reenvío</tspan><tspan x="921" dy="21"> </tspan><tspan x="921" dy="21">pones la dirección en Gmail;</tspan><tspan x="921" dy="21">el worker sigue el enlace solo</tspan><tspan x="921" dy="21"> </tspan><tspan x="921" dy="21">forwarding_confirmed</tspan></text></g><g class="czQ= card"><g class="shape" ><rect x="1134" y="0" width="330" height="210" rx="12" stroke="#22D3EE" fill="#14112B" style="stroke-width:3;" /></g><text x="1299" y="62" fill="#F8FAFC" class="text-bold" style="text-anchor:middle;font-size:20px"><tspan x="1299" dy="0">4 · Llega la primera alerta</tspan><tspan x="1299" dy="21"> </tspan><tspan x="1299" dy="21">tu filtro reenvía; el worker</tspan><tspan x="1299" dy="21">la acepta en su siguiente pasada</tspan><tspan x="1299" dy="21"> </tspan><tspan x="1299" dy="21">first_alert</tspan></text></g><g class="KHMxIC0mZ3Q7IHMyKVswXQ== event"><marker id="mk-d2-2582910892-4093171048" markerWidth="13" markerHeight="16" refX="8.5" refY="8" viewBox="0 0 13 16" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 13,8 0,16" fill="#22D3EE" class="connection" stroke-width="3" /> </marker><path d="M 333 105 L 372 105" stroke="#22D3EE" fill="none" class="connection animated-connection" style="stroke-width:3;stroke-dasharray:15.000000,14.583620;stroke-dashoffset:-295.836200;animation: dashdraw 7.291810s linear infinite;" marker-end="url(#mk-d2-2582910892-4093171048)" mask="url(#d2-2582910892)" /></g><g class="KHMyIC0mZ3Q7IHMzKVswXQ== event"><path d="M 711 105 L 750 105" stroke="#22D3EE" fill="none" class="connection animated-connection" style="stroke-width:3;stroke-dasharray:15.000000,14.583620;stroke-dashoffset:-295.836200;animation: dashdra