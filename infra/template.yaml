AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  Finflow's compute plane: the five functions, what triggers them, and what
  they are allowed to touch.

  It deliberately does not create the tables, queues, bus or rules. Those are
  the data plane, `provisioning.py` owns them, and local development runs
  against moto with the same code — moto can emulate a queue, it cannot run a
  function. Splitting there keeps one story for local and one tool per job;
  moving them here would mean the local environment had no way to exist.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [development, production]
    Description: >
      Passed straight through as ENVIRONMENT. The application derives its own
      resource names from it — this template never spells a prefixed name into
      a variable, only into the ARNs it grants access to.

  ResourcePrefix:
    Type: String
    Default: ""
    AllowedValues: ["", "dev-"]
    Description: >
      Must match what `Environment.resource_prefix` produces for
      EnvironmentName: "" for production, "dev-" for development. Only the
      ARNs below use it; the application prefixes its own names in code.

  IngestMailboxAddress:
    Type: String
    Description: The Gmail account every user forwards their bank mail to.

  JwtSecretParameter:
    Type: String
    Default: /finflow/production/jwt-secret
    Description: SSM parameter holding the token-signing secret.

  MailboxPasswordParameter:
    Type: String
    Default: /finflow/production/mailbox-app-password
    Description: SSM parameter holding the mailbox App Password.

  LlmApiKeyParameter:
    Type: String
    Default: /finflow/production/llm-api-key
    Description: SSM parameter holding the Gemini API key.

  MailFromAddress:
    Type: String
    Description: >
      The Gmail account identity mails verification codes and password-reset
      links from. Required: without it the API refuses to start, because a
      deployment that cannot mail a code is one where nobody can register or
      recover an account. May be the ingest mailbox or a separate account —
      it only has to match MailAppPasswordParameter below.

  MailAppPasswordParameter:
    Type: String
    Default: /finflow/production/mail-app-password
    Description: >
      SSM parameter holding the App Password for MailFromAddress. One
      credential split across two places; only SMTP finds out if they
      disagree.

  PasswordResetUrl:
    Type: String
    Description: >
      The frontend page a reset link points at. Must be https outside local:
      the token travels in the query string, and http would put it in front of
      anything on the path. The API appends `?token=...` to it.

  CorsOrigins:
    Type: String
    Default: ""
    Description: >
      Comma-separated origins allowed to call the API from a browser. Empty
      means none, which is correct when the frontend is served from this same
      origin.

  LogRetentionDays:
    Type: Number
    Default: 30
    Description: >
      Set explicitly because the default is "never expire", and log storage
      that nobody ever deletes is the one line of this bill that only grows.

  IngestScheduleExpression:
    Type: String
    Default: rate(1 minute)
    Description: >
      How often the mailbox is polled. This is the single largest consumer of
      the Lambda free tier — almost entirely invocations that find an empty
      mailbox — so it is the first dial to turn if that ever matters.

  IngestScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: >
      Whether this stack polls the shared ingest mailbox. Exactly one stack
      may: the reader searches UNSEEN and marks what it takes \Seen, so two
      pollers do not duplicate a message, they race for it — each email lands
      in whichever stack asked first, and is invisible to the other. With one
      Gmail account behind both environments, production is the one that polls
      and development is DISABLED. Everything else in a disabled stack still
      works; only the automatic intake stops.

  TelegramBotUsername:
    Type: String
    Default: ""
    Description: >
      The bot's @name, without the @. It is not a secret — it is half of the
      deep link every user taps — so it lives here rather than in SSM.

  TelegramBotTokenParameter:
    Type: String
    Default: /finflow/production/telegram-bot-token
    Description: >
      SSM parameter holding the @BotFather token. Read by the API (which says
      hello the moment a channel binds) and by the alerts worker (which sends
      every alert). Write it with `just secret-put`; never put the value here.

  TelegramWebhookSecretParameter:
    Type: String
    Default: /finflow/production/telegram-webhook-secret
    Description: >
      SSM parameter holding the value Telegram echoes back in
      X-Telegram-Bot-Api-Secret-Token. It is the only thing authenticating the
      webhook, because a Function URL with AuthType NONE has no resource
      policy and cannot be pinned to Telegram's address ranges. Read by the
      API alone.

  AlertEmail:
    Type: String
    Default: ""
    Description: >
      Where a dead-letter alarm is sent. Empty creates the topic but no
      subscription, which is a deployable state and a useless one: the alarm
      fires into a topic nobody reads. Set it.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Globals:
  Function:
    # `PackageType` is deliberately absent: SAM's Globals accepts a fixed list
    # of properties and this is not on it, so putting the five functions' one
    # shared value here fails the transform outright rather than being merged.
    # It is repeated per function instead.
    Timeout: 30
    MemorySize: 512
    # Matches the machine the image is built on. arm64 is marginally cheaper,
    # but at this volume both are inside the free tier, and an image built
    # x86_64 against an arm64 function fails the deploy for no gain.
    Architectures: [x86_64]
    Environment:
      Variables:
        # No secret reference here. A value in Globals is a value every
        # function carries, and a reference carried is a permission needed:
        # the three `ssm:` refs live on the single function that resolves
        # each, so the grant below can be exactly one parameter wide. An
        # unset one is read as empty and never reaches Parameter Store.
        #
        # Bare names throughout: `Environment.resource_prefix` adds `dev-` in
        # the application, and doing it in both places would produce
        # `dev-dev-users`. The prefix appears below only inside ARNs.
        ENVIRONMENT: !Ref EnvironmentName
        INGESTION_NOTIFICATIONS_TABLE: bank_notifications
        INGESTION_USER_INBOXES_TABLE: user_inboxes
        INGESTION_EVENT_BUS_NAME: finflow
        INGESTION_RETENTION_DAYS: "90"
        INGESTION_PARSE_QUEUE_NAME: parse-notifications
        INGESTION_PARSE_QUEUE_URL: !Sub "https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/${ResourcePrefix}parse-notifications"
        INGESTION_INTEGRATION_EVENTS_QUEUE_NAME: integration-events
        INGESTION_INTEGRATION_EVENTS_QUEUE_URL: !Sub "https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/${ResourcePrefix}integration-events"
        INGESTION_DYNAMODB_BILLING_MODE: PAY_PER_REQUEST
        INGESTION_DYNAMODB_MAX_READ_UNITS: "25"
        INGESTION_DYNAMODB_MAX_WRITE_UNITS: "25"
        INGESTION_INGEST_MAILBOX_ADDRESS: !Ref IngestMailboxAddress
        INGESTION_INGEST_MAILBOX_HOST: imap.gmail.com
        INGESTION_INGEST_MAILBOX_PORT: "993"
        IDENTITY_USERS_TABLE: users
        IDENTITY_CHALLENGES_TABLE: credential_challenges
        IDENTITY_JWT_ALGORITHM: HS256
        IDENTITY_ACCESS_TOKEN_TTL_MINUTES: "1440"
        MERCHANT_MERCHANTS_TABLE: merchants
        MERCHANT_EVENTS_QUEUE_NAME: merchant-events
        MERCHANT_EVENTS_QUEUE_URL: !Sub "https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/${ResourcePrefix}merchant-events"
        FINANCIAL_ACCOUNTS_TABLE: financial
        FINANCIAL_EVENTS_QUEUE_NAME: financial-events
        FINANCIAL_EVENTS_QUEUE_URL: !Sub "https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/${ResourcePrefix}financial-events"
        ALERTS_CHANNELS_TABLE: alert_channels
        ALERTS_EVENTS_QUEUE_NAME: alerts-events
        ALERTS_EVENTS_QUEUE_URL: !Sub "https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/${ResourcePrefix}alerts-events"
        ALERTS_TELEGRAM_BOT_USERNAME: !Ref TelegramBotUsername
        ALERTS_LINK_TTL_MINUTES: "15"
        ALERTS_MAX_CHANNELS_PER_USER: "5"
        ALERTS_DISPLAY_TIMEZONE: America/Bogota
        LLM_MODEL: gemini-3.6-flash
        LLM_MAX_OUTPUT_TOKENS: "4096"
        LLM_TIMEOUT_SECONDS: "30"
        LLM_MAX_INPUT_CHARACTERS: "40000"

Resources:
  # ------------------------------------------------------------------
  # API — the same uvicorn command as `just run-prod`, behind the adapter
  # ------------------------------------------------------------------
  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ..
      Dockerfile: Dockerfile
      DockerTag: api
    Properties:
      PackageType: Image
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      ImageConfig:
        # Overriding the entry point is what turns this container into a web
        # server instead of a handler runner. The adapter in /opt/extensions
        # does the rest.
        EntryPoint:
          - /var/lang/bin/python
          - -m
          - uvicorn
          - personal_finance.api.main:app
          - --host
          - 0.0.0.0
          - --port
          - "8000"
        Command: []
      Environment:
        Variables:
          API_CORS_ORIGINS: !Ref CorsOrigins
          # There *is* something in front of this process — the adapter, fed
          # by the Function URL — so the address a request came from can be
          # read from the context AWS builds instead of from a socket that
          # is always the adapter itself. Without this every request on earth
          # would be counted under one address, and the first attack would
          # lock everybody out. See `shared/presentation/throttling.py`.
          API_TRUST_PROXY_HEADERS: "true"
          # Only the API signs and verifies tokens.
          IDENTITY_JWT_SECRET: !Sub "ssm:${JwtSecretParameter}"
          # And only the API sends mail: the codes and reset links belong to
          # endpoints, not to any worker. Both references sit here for the
          # same reason the signing secret does — a reference carried is a
          # permission needed.
          IDENTITY_MAIL_FROM_ADDRESS: !Ref MailFromAddress
          IDENTITY_MAIL_APP_PASSWORD: !Sub "ssm:${MailAppPasswordParameter}"
          IDENTITY_PASSWORD_RESET_URL: !Ref PasswordResetUrl
          # The only thing authenticating the Telegram webhook, which only the
          # API serves. A Function URL with AuthType NONE has no resource
          # policy, so Telegram's address ranges cannot be pinned and this
          # shared secret is the whole of the door.
          ALERTS_TELEGRAM_WEBHOOK_SECRET: !Sub "ssm:${TelegramWebhookSecretParameter}"
          # And the bot token, so binding a channel can answer "listo" in the
          # same breath. That reply is what proves this deployment can reach
          # the address it just bound, while its owner is still watching
          # Telegram — rather than finding out at their first purchase.
          ALERTS_TELEGRAM_BOT_TOKEN: !Sub "ssm:${TelegramBotTokenParameter}"
      FunctionUrlConfig:
        # The application authenticates every request itself with a bearer
        # token, so IAM auth here would only lock out the browser it exists
        # for. This is what gives the phone an HTTPS address with no domain,
        # no certificate and no load balancer.
        AuthType: NONE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "${ResourcePrefix}users"
        # Verification codes, registration tickets and reset links. Only the
        # API touches them: nothing asynchronous is involved in proving that
        # somebody can read their own mail.
        - DynamoDBCrudPolicy:
            TableName: !Sub "${ResourcePrefix}credential_challenges"
        - DynamoDBCrudPolicy:
            TableName: !Sub "${ResourcePrefix}user_inboxes"
        # Wrong passwords, wrong codes and wrong webhook secrets, counted per
        # address so a guesser runs out before a password does. Only the API
        # writes here: no worker has a door to guard.
        - DynamoDBCrudPolicy:
            TableName: !Sub "${ResourcePrefix}throttle"
        - DynamoDBReadPolicy:
            TableName: !Sub "${ResourcePrefix}bank_notifications"
        - DynamoDBCrudPolicy:
            TableName: !Sub "${ResourcePrefix}merchants"
        - DynamoDBCrudPolicy:
            TableName: !Sub "${ResourcePrefix}financial"
        # Channels, links, chat reservations. The API creates and binds them;
        # the worker only reads channels and writes delivery markers.
        - DynamoDBCrudPolicy:
            TableName: !Sub "${ResourcePrefix}alert_channels"
        - EventBridgePutEventsPolicy:
            EventBusName: !Sub "${ResourcePrefix}finflow"
        # Exactly the one parameter this function resolves, and no other.
        # `/finflow/*` would have spanned both `/finflow/development/*` and
        # `/finflow/production/*` — the two stacks share one AWS account, so
        # that wildcard handed the dev stack production's signing key and
        # mailbox password. The `dev-` prefix isolates tables, queues and the
        # bus; nothing was doing the same for secrets.
        #
        # The API is the only thing that signs or verifies a token.
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${JwtSecretParameter}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${MailAppPasswordParameter}"
                # The webhook's shared secret, and the bot token it needs to
                # answer "listo" the moment a channel binds. The hello is what
                # proves this deployment can actually send to the address it
                # just bound, while its owner is still looking at Telegram.
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TelegramWebhookSecretParameter}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TelegramBotTokenParameter}"
            # SecureString decryption goes through the AWS-managed SSM key,
            # reachable only via SSM itself.
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  # ------------------------------------------------------------------
  # Ingest — the only worker whose loop did not survive the move
  # ------------------------------------------------------------------
  IngestFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ..
      Dockerfile: Dockerfile
      DockerTag: ingest
    Properties:
      PackageType: Image
      Environment:
        Variables:
          # Only this function opens the mailbox.
          INGESTION_INGEST_MAILBOX_APP_PASSWORD: !Sub "ssm:${MailboxPasswordParameter}"
      LoggingConfig:
        LogGroup: !Ref IngestLogGroup
      ImageConfig:
        Command:
          - personal_finance.contexts.ingestion.presentation.awslambda.ingest_handler.handler
      # An IMAP round trip plus one write per message. Generous because the
      # cost of a slow pass is nothing and the cost of a truncated one is a
      # message read but never queued.
      Timeout: 120
      # One poller, always. Two would race for the same UNSEEN messages and
      # each mark the other's as read.
      ReservedConcurrentExecutions: 1
      Events:
        Tick:
          Type: Schedule
          Properties:
            Schedule: !Ref IngestScheduleExpression
            State: !Ref IngestScheduleState
            Description: Poll the shared ingest mailbox.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "${ResourcePrefix}bank_notifications"
        - DynamoDBCrudPolicy:
            TableName: !Sub "${ResourcePrefix}user_inboxes"
        - SQSSendMessagePolicy:
            QueueName: !Sub "${ResourcePrefix}parse-notifications"
        - EventBridgePutEventsPolicy:
            EventBusName: !Sub "${ResourcePrefix}finflow"
        # Exactly the one parameter this function resolves, and no other.
        # `/finflow/*` would have spanned both `/finflow/development/*` and
        # `/finflow/production/*` — the two stacks share one AWS account, so
        # that wildcard handed the dev stack production's signing key and
        # mailbox password. The `dev-` prefix isolates tables, queues and the
        # bus; nothing was doing the same for secrets.
        #
        # Only the ingest function opens the mailbox.
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${MailboxPasswordParameter}"
            # SecureString decryption goes through the AWS-managed SSM key,
            # reachable only via SSM itself.
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  # ------------------------------------------------------------------
  # Parse — SQS to deterministic parser to LLM fallback
  # ------------------------------------------------------------------
  ParseFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ..
      Dockerfile: Dockerfile
      DockerTag: parse
    Properties:
      PackageType: Image
      Environment:
        Variables:
          # The deterministic parser's fallback.
          LLM_API_KEY: !Sub "ssm:${LlmApiKeyParameter}"
      LoggingConfig:
        LogGroup: !Ref ParseLogGroup
      ImageConfig:
        Command:
          - personal_finance.contexts.ingestion.presentation.awslambda.parse_handler.handler
      # Capped by the queue, not chosen freely: Lambda refuses an event source
      # mapping whose function timeout exceeds the queue's VisibilityTimeout,
      # which `provisioning.py` sets to 120s. A longer timeout here does not
      # deploy at all — and if it did, the message would become visible again
      # mid-run and be processed a second time, concurrently.
      Timeout: 120
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !Sub "arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${ResourcePrefix}parse-notifications"
            # Three, not ten: every message can fall through to the model at
            # LLM_TIMEOUT_SECONDS=30, so ten of them would not fit inside the
            # 120s above. The batch size is what has to give.
            BatchSize: 3
            # Without this, the handler's batchItemFailures response is
            # ignored and every message in the batch is deleted — including
            # the ones it asked to keep. It is the single line that makes the
            # whole retry story true rather than merely written down.
            FunctionResponseTypes:
              - ReportBatchItemFailures
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "${ResourcePrefix}bank_notifications"
        - EventBridgePutEventsPolicy:
            EventBusName: !Sub "${ResourcePrefix}finflow"
        # Exactly the one parameter this function resolves, and no other.
        # `/finflow/*` would have spanned both `/finflow/development/*` and
        # `/finflow/production/*` — the two stacks share one AWS account, so
        # that wildcard handed the dev stack production's signing key and
        # mailbox password. The `dev-` prefix isolates tables, queues and the
        # bus; nothing was doing the same for secrets.
        #
        # The parser's fallback is the model.
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${LlmApiKeyParameter}"
            # SecureString decryption goes through the AWS-managed SSM key,
            # reachable only via SSM itself.
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  # ------------------------------------------------------------------
  # Merchant — canonical merchants
  # ------------------------------------------------------------------
  MerchantFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ..
      Dockerfile: Dockerfile
      DockerTag: merchant
    Properties:
      PackageType: Image
      Environment:
        Variables:
          # The merchant advisor.
          LLM_API_KEY: !Sub "ssm:${LlmApiKeyParameter}"
      LoggingConfig:
        LogGroup: !Ref MerchantLogGroup
      ImageConfig:
        Command:
          - personal_finance.contexts.merchant.presentation.awslambda.merchant_handler.handler
      Timeout: 120
      # Serialised deliberately, and the only function that is. Two alerts
      # naming the same unseen merchant could otherwise be resolved side by
      # side and each create a canonical record for it. The polling loop was
      # serial by construction; this is what buys that back until the write
      # path is proven safe under concurrency.
      ReservedConcurrentExecutions: 1
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !Sub "arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${ResourcePrefix}merchant-events"
            # Same arithmetic as Parse: the advisor is an LLM call too.
            BatchSize: 3
            FunctionResponseTypes:
              - ReportBatchItemFailures
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "${ResourcePrefix}merchants"
        - EventBridgePutEventsPolicy:
            EventBusName: !Sub "${ResourcePrefix}finflow"
        # Exactly the one parameter this function resolves, and no other.
        # `/finflow/*` would have spanned both `/finflow/development/*` and
        # `/finflow/production/*` — the two stacks share one AWS account, so
        # that wildcard handed the dev stack production's signing key and
        # mailbox password. The `dev-` prefix isolates tables, queues and the
        # bus; nothing was doing the same for secrets.
        #
        # The merchant advisor is the model.
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${LlmApiKeyParameter}"
            # SecureString decryption goes through the AWS-managed SSM key,
            # reachable only via SSM itself.
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  # ------------------------------------------------------------------
  # Financial — the ledger and the balances
  # ------------------------------------------------------------------
  FinancialFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ..
      Dockerfile: Dockerfile
      DockerTag: financial
    Properties:
      PackageType: Image
      LoggingConfig:
        LogGroup: !Ref FinancialLogGroup
      ImageConfig:
        Command:
          - personal_finance.contexts.financial.presentation.awslambda.financial_handler.handler
      MemorySize: 256
      Timeout: 60
      # Left to scale: the ledger row is a conditional write and the balance
      # an atomic ADD, both inside one transaction, so a movement applied
      # twice is a no-op and two movements on one account cannot lose each
      # other. That is why this function needs no concurrency limit and
      # Merchant does.
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !Sub "arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${ResourcePrefix}financial-events"
            # A full batch: no model in this path, only DynamoDB writes.
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "${ResourcePrefix}financial"
        - EventBridgePutEventsPolicy:
            EventBusName: !Sub "${ResourcePrefix}finflow"

  # ------------------------------------------------------------------
  # Alerts — the only worker that talks to somebody outside this system
  # ------------------------------------------------------------------
  AlertsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ..
      Dockerfile: Dockerfile
      DockerTag: alerts
    Properties:
      PackageType: Image
      LoggingConfig:
        LogGroup: !Ref AlertsLogGroup
      ImageConfig:
        Command:
          - personal_finance.contexts.alerts.presentation.awslambda.alerts_handler.handler
      MemorySize: 256
      # Must stay at or under the queue's VisibilityTimeout of 120s, or the
      # event source mapping will not deploy.
      Timeout: 120
      # Serialised deliberately. Delivery is remembered *after* the message
      # goes out — the opposite of merchant's order, because a crash that
      # loses an alert is a purchase nobody hears about, while a crash that
      # repeats one is a duplicate message. That trade only holds against
      # sequential redelivery; two workers running at once would both read
      # "not yet delivered" and both send. At this volume, one is free.
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          ALERTS_TELEGRAM_BOT_TOKEN: !Sub "ssm:${TelegramBotTokenParameter}"
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !Sub "arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${ResourcePrefix}alerts-events"
            # Five, not ten: each message may spend up to 10s waiting on
            # Telegram, and 5 x 10s fits inside the 120s above with room to
            # spare. Ten would not.
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "${ResourcePrefix}alert_channels"
        # No EventBridgePutEventsPolicy: alerts is a leaf. It subscribes to
        # finflow.financial and publishes nothing, so it has no translator and
        # nothing to put on the bus.
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TelegramBotTokenParameter}"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  # ------------------------------------------------------------------
  # Logs — retention set explicitly, per function
  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # Logs
  #
  # Named by us, not `/aws/lambda/<function>`. Lambda creates that one itself
  # on first invocation, so declaring it here is a race the stack loses on any
  # redeploy where it already exists — "already exists", rollback, no deploy.
  # A name Lambda would never pick has no such conflict, and `LoggingConfig`
  # is what points each function at it.
  # ------------------------------------------------------------------
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/finflow/${AWS::StackName}/api"
      RetentionInDays: !Ref LogRetentionDays

  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/finflow/${AWS::StackName}/ingest"
      RetentionInDays: !Ref LogRetentionDays

  ParseLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/finflow/${AWS::StackName}/parse"
      RetentionInDays: !Ref LogRetentionDays

  MerchantLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/finflow/${AWS::StackName}/merchant"
      RetentionInDays: !Ref LogRetentionDays

  FinancialLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/finflow/${AWS::StackName}/financial"
      RetentionInDays: !Ref LogRetentionDays

  AlertsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/finflow/${AWS::StackName}/alerts"
      RetentionInDays: !Ref LogRetentionDays

  # ------------------------------------------------------------------
  # Dead letters — the only thing that says processing stopped
  # ------------------------------------------------------------------
  # A message reaches a DLQ after SQS has already retried it, so one message
  # is not a blip: it is work that will never be done unless somebody looks.
  # Silence was the failure mode worth closing first — a bank changing its
  # email template drains no queue and raises no error anyone sees.
  #
  # The queues are the data plane and `provisioning.py` owns them, so these
  # alarms name them rather than reference them. That is the cost of the split
  # and it is paid here: a queue renamed there leaves an alarm watching a name
  # that no longer exists, and an alarm on a queue that does not exist reports
  # INSUFFICIENT_DATA, not an error.
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alerts"
      DisplayName: Finflow alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  ParseDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-parse-dead-letters"
      AlarmDescription: >
        An email was read but could not be parsed, even after retries.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !Sub "${ResourcePrefix}parse-notifications-dlq"
      # Maximum, not Average: a single message arriving and being drained
      # inside the period averages back to nearly zero and reports nothing.
      Statistic: Maximum
      # SQS publishes these every five minutes; a shorter period would only
      # produce gaps.
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # An idle queue publishes no data points at all, which must not read as
      # a breach.
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  MerchantDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-merchant-dead-letters"
      AlarmDescription: >
        A parsed transaction never reached merchant normalisation.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !Sub "${ResourcePrefix}merchant-events-dlq"
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  FinancialDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-financial-dead-letters"
      AlarmDescription: >
        A movement never reached the ledger, so a balance is understated.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !Sub "${ResourcePrefix}financial-events-dlq"
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  # Named for the queue, not for the context: `${AWS::StackName}-alerts` is
  # already the SNS topic these alarms publish *to*, and two resources whose
  # names differ by a suffix are two resources somebody will confuse at 3am.
  AlertDeliveryDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-alerts-events-dead-letters"
      AlarmDescription: >
        A movement was recorded and nobody was told about it.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !Sub "${ResourcePrefix}alerts-events-dlq"
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

Outputs:
  ApiUrl:
    Description: >
      The HTTPS address of the API. This is what goes into the phone's browser
      and into the frontend's configuration.
    Value: !GetAtt ApiFunctionUrl.FunctionUrl

  ApiFunctionName:
    Description: For `sam logs -n <name>`.
    Value: !Ref ApiFunction

  AlertTopicArn:
    Description: >
      Where the dead-letter alarms publish. Subscribe a second endpoint here
      rather than editing the alarms.
    Value: !Ref AlertTopic
