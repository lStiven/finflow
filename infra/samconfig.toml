# Deploy settings per environment, so `just deploy-prod` is a command and not
# a list of flags to remember.
#
# This file is tracked, and nothing secret belongs in it: the three secrets
# appear only as SSM *paths*, and the values behind them are put there with
# `just secret-put`. Check with `grep -i 'secret\|password\|key' samconfig.toml`
# — every hit should be a path starting with `/finflow/`.

version = 0.1

[default.global.parameters]
stack_name = "finflow"

[default.build.parameters]
# One image, five functions: without the cache each function rebuilds it.
cached = true
parallel = true

[default.validate.parameters]
lint = true

# ----------------------------------------------------------------------
# development — its own AWS account, every resource still prefixed `dev-`
# ----------------------------------------------------------------------
[development.global.parameters]
stack_name = "finflow-dev"

[development.build.parameters]
cached = true
parallel = true

[development.deploy.parameters]
stack_name = "finflow-dev"
region = "us-east-1"
profile = "finflow-dev"
capabilities = "CAPABILITY_IAM"
# Lets SAM create and manage the ECR repository for the image. The companion
# stack that holds it is uploaded to S3, so this needs a bucket too — hence
# the managed one.
resolve_image_repos = true
resolve_s3 = true
confirm_changeset = true
parameter_overrides = [
    "EnvironmentName=development",
    "ResourcePrefix=dev-",
    "IngestMailboxAddress=finflowingest@gmail.com",
    "JwtSecretParameter=/finflow/development/jwt-secret",
    # Empty deploys, but the dead-letter alarms then page nobody.
    "AlertEmail=llstiven.work@gmail.com",
    "MailboxPasswordParameter=/finflow/development/mailbox-app-password",
    "LlmApiKeyParameter=/finflow/development/llm-api-key",
    "CorsOrigins=http://localhost:5173",
    # Cheaper on the free tier and plenty for a rehearsal environment.
    'IngestScheduleExpression="rate(5 minutes)"',
    # One Gmail account behind both stacks, and the reader consumes what it
    # reads. Production polls it; this one would steal the messages. Flip the
    # two if the rehearsal environment ever needs the intake back.
    "IngestScheduleState=DISABLED",
    "LogRetentionDays=7",
]

# ----------------------------------------------------------------------
# production
# ----------------------------------------------------------------------
[production.global.parameters]
stack_name = "finflow"

[production.build.parameters]
cached = true
parallel = true

[production.deploy.parameters]
stack_name = "finflow"
region = "us-east-1"
profile = "finflow-production"
capabilities = "CAPABILITY_IAM"
resolve_image_repos = true
resolve_s3 = true
confirm_changeset = true
parameter_overrides = [
    "EnvironmentName=production",
    # Quoted, and it has to be: SAM's override parser accepts an empty value
    # only between quotes — bare `ResourcePrefix=` is rejected before the
    # deploy starts. Production is the only environment with empty values, so
    # this surfaced on its very first deploy and never on `deploy-dev`.
    'ResourcePrefix=""',
    "IngestMailboxAddress=finflowingest@gmail.com",
    "JwtSecretParameter=/finflow/production/jwt-secret",
    # Empty deploys, but the dead-letter alarms then page nobody.
    "AlertEmail=llstiven.work@gmail.com",
    "MailboxPasswordParameter=/finflow/production/mailbox-app-password",
    "LlmApiKeyParameter=/finflow/production/llm-api-key",
    # Empty until there is a frontend on its own origin. See
    # docs/frontend-integration.md.
    'CorsOrigins=""',
    'IngestScheduleExpression="rate(1 minute)"',
    # The one stack that reads the mailbox. See IngestScheduleState.
    "IngestScheduleState=ENABLED",
    "LogRetentionDays=30",
]
