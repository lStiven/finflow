# Deploy settings per environment, so `just deploy-prod` is a command and not
# a list of flags to remember.
#
# This file is tracked, and nothing secret belongs in it: the three secrets
# appear only as SSM *paths*, and the values behind them are put there with
# `just secret-put`. Check with `grep -i 'secret\|password\|key' samconfig.toml`
# — every hit should be a path starting with `/finflow/`.

version = 0.1

[default.global.parameters]
stack_name = "finflow"

[default.build.parameters]
# One image, six functions: without the cache each function rebuilds it.
cached = true
parallel = true

[default.validate.parameters]
lint = true

# ----------------------------------------------------------------------
# development — its own AWS account, every resource still prefixed `dev-`
# ----------------------------------------------------------------------
[development.global.parameters]
stack_name = "finflow-dev"

[development.build.parameters]
cached = true
parallel = true

[development.deploy.parameters]
stack_name = "finflow-dev"
region = "us-east-1"
profile = "finflow-dev"
capabilities = "CAPABILITY_IAM"
# Lets SAM create and manage the ECR repository for the image. The companion
# stack that holds it is uploaded to S3, so this needs a bucket too — hence
# the managed one.
resolve_image_repos = true
resolve_s3 = true
confirm_changeset = true
# A deploy that changes nothing is not a failure.
#
# SAM's default is to exit non-zero on an empty changeset, and the backend
# image only carries `pyproject.toml`, `uv.lock` and `src/personal_finance` —
# so every branch that touches only the frontend, the docs or the justfile
# builds an image byte-identical to the one already deployed and then reports
# a failure for it. What actually happened is "nothing to do", and that is
# what this makes it say.
fail_on_empty_changeset = false
parameter_overrides = [
    "EnvironmentName=development",
    "ResourcePrefix=dev-",
    # Its own Gmail account, not production's. This is what lets both stacks
    # poll at once: the reader searches UNSEEN and marks what it takes \Seen,
    # so two pollers on one mailbox do not duplicate a message, they race for
    # it. Separate mailboxes, no race. It also has to match the App Password
    # stored at `MailboxPasswordParameter` below — they are one credential
    # split across two places, and only IMAP finds out they disagree.
    "IngestMailboxAddress=finflowdevelopment@gmail.com",
    "JwtSecretParameter=/finflow/development/jwt-secret",
    # Empty deploys, but the dead-letter alarms then page nobody.
    "AlertEmail=llstiven.work@gmail.com",
    "MailboxPasswordParameter=/finflow/development/mailbox-app-password",
    # De dónde salen los códigos de verificación y los enlaces para
    # restablecer la contraseña. La misma cuenta que lee el correo entrante
    # sirve: son la misma casilla, sólo que una se lee por IMAP y la otra
    # escribe por SMTP, y la App Password es la misma.
    "MailFromAddress=finflowdevelopment@gmail.com",
    "MailAppPasswordParameter=/finflow/development/mailbox-app-password",
    # La página del frontend que recibe el token del enlace.
    "PasswordResetUrl=https://finflow-dev-2tc.pages.dev/restablecer",
    "LlmApiKeyParameter=/finflow/development/llm-api-key",
    # Los avisos por Telegram. **Estas tres tienen que estar aquí**: el
    # template las declara con un default que apunta a `/finflow/production/`,
    # así que un override olvidado no falla — hace que este stack lea los
    # secretos del otro. Es exactamente el cruce que el comentario de
    # `template.yaml` describe sobre `/finflow/*`, y así se cayó el primer
    # despliegue de dev con E1: pedía `/finflow/production/telegram-bot-token`.
    "TelegramBotUsername=finflow_v2_dev_bot",
    "TelegramBotTokenParameter=/finflow/development/telegram-bot-token",
    "TelegramWebhookSecretParameter=/finflow/development/telegram-webhook-secret",
    # El bundle de este stack. El subdominio **no** es el nombre del
    # proyecto: `*.pages.dev` es único en todo Cloudflare, así que un nombre
    # ya tomado recibe un sufijo — `finflow-dev.pages.dev` es de otra
    # cuenta. Es el origen que imprime `just web-publish-dev`.
    "CorsOrigins=http://localhost:5173,https://finflow-dev-2tc.pages.dev",
    # Cheaper on the free tier and plenty for a rehearsal environment.
    'IngestScheduleExpression="rate(5 minutes)"',
    # Both stacks poll now, each its own mailbox. This was DISABLED while the
    # two shared one account — the only arrangement in which a second poller
    # is a thief rather than a second environment.
    "IngestScheduleState=ENABLED",
    "LogRetentionDays=7",
]

# ----------------------------------------------------------------------
# production
# ----------------------------------------------------------------------
[production.global.parameters]
stack_name = "finflow"

[production.build.parameters]
cached = true
parallel = true

[production.deploy.parameters]
stack_name = "finflow"
region = "us-east-1"
profile = "finflow-production"
capabilities = "CAPABILITY_IAM"
resolve_image_repos = true
resolve_s3 = true
confirm_changeset = true
# A deploy that changes nothing is not a failure.
#
# SAM's default is to exit non-zero on an empty changeset, and the backend
# image only carries `pyproject.toml`, `uv.lock` and `src/personal_finance` —
# so every branch that touches only the frontend, the docs or the justfile
# builds an image byte-identical to the one already deployed and then reports
# a failure for it. What actually happened is "nothing to do", and that is
# what this makes it say.
fail_on_empty_changeset = false
parameter_overrides = [
    "EnvironmentName=production",
    # Quoted, and it has to be: SAM's override parser accepts an empty value
    # only between quotes — bare `ResourcePrefix=` is rejected before the
    # deploy starts. Production is the only environment with empty values, so
    # this surfaced on its very first deploy and never on `deploy-dev`.
    'ResourcePrefix=""',
    "IngestMailboxAddress=finflowingest@gmail.com",
    "JwtSecretParameter=/finflow/production/jwt-secret",
    # Empty deploys, but the dead-letter alarms then page nobody.
    "AlertEmail=llstiven.work@gmail.com",
    "MailboxPasswordParameter=/finflow/production/mailbox-app-password",
    # De dónde salen los códigos de verificación y los enlaces para
    # restablecer la contraseña. Es la misma casilla que lee el correo
    # entrante: una se lee por IMAP y la otra escribe por SMTP, con la misma
    # App Password. Sin esto la API no arranca — deliberado: un despliegue que
    # no puede enviar un código es uno donde nadie puede registrarse.
    "MailFromAddress=finflowingest@gmail.com",
    "MailAppPasswordParameter=/finflow/production/mailbox-app-password",
    # La página del frontend que recibe el token del enlace. Tiene que ser
    # https: el token viaja en la query.
    "PasswordResetUrl=https://finflow-apk.pages.dev/restablecer",
    "LlmApiKeyParameter=/finflow/production/llm-api-key",
    # Los avisos por Telegram. Un bot distinto al de desarrollo: son dos
    # stacks hablándole a personas reales, y un solo bot no podría decir de
    # cuál de los dos viene un aviso.
    "TelegramBotUsername=finflow_v2_bot",
    "TelegramBotTokenParameter=/finflow/production/telegram-bot-token",
    "TelegramWebhookSecretParameter=/finflow/production/telegram-webhook-secret",
    # The bundle is on Cloudflare Pages while this account cannot create a
    # CloudFront distribution, so the frontend is on an origin the API does
    # not otherwise know. Put the exact origin `just web-publish` prints here
    # — scheme and host, no path — and redeploy; the list is matched exactly,
    # so a custom domain is a second entry and a Pages preview URL can never
    # be one. Empty accepts no browser origin at all.
    # El bundle de producción, publicado con `just web-publish`. El subdominio
    # lo asigna Cloudflare y no es el nombre del proyecto: `finflow` ya estaba
    # tomado. `http://localhost:5173` sigue aquí para poder apuntar el servidor
    # de desarrollo a esta API; quítalo cuando deje de hacer falta, porque
    # habilita a cualquier página servida en ese puerto, en cualquier máquina.
    'CorsOrigins="https://finflow-apk.pages.dev,http://localhost:5173"',
    'IngestScheduleExpression="rate(1 minute)"',
    # Reads `IngestMailboxAddress` above, which is not development's. See the
    # note there before pointing two stacks at one account again.
    "IngestScheduleState=ENABLED",
    "LogRetentionDays=30",
]
